plugins {
    id 'com.unascribed.nilgradle' version '1.5.2'
}

java {
    // You can change this to be higher if you like. NilLoader itself is compiled
    // for Java 8 for compatibility with older versions.
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

group = 'de.femtopedia'
version = project.findProperty('version')
version = version == null || version == 'unspecified' ? '1.0' : version

base {
    archivesName = 'LegacyForgeJ8'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.sleeping.town'
        content {
            includeGroup 'com.unascribed'
        }
    }
    maven {
        url = 'https://maven.minecraftforge.net'
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'net.minecraftforge'
        }
    }
}

sourceSets {
    java6 {
    }
}

tasks.named('compileJava6Java', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = '1.6'
    targetCompatibility = '1.6'
    options.compilerArgs << '-Xlint:-options'
}

tasks.named('jar') {
    from sourceSets.java6.output
}

nil {
    id "legacyforgej8"
    // Set this to false for a smaller JAR that can't be run as a standalone Java agent
    standalone false
}

dependencies {
    loader 'com.unascribed:nilloader:1.4.1'

    game nil.minecraft('1.4.7', 'client')

    jarmod 'net.minecraftforge:forge:1.4.6-6.5.0.451:universal@zip'
}

mappings {
    work nil.mcpArchive('1.4.7', '726a')
}
